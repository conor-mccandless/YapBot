name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.4-alpine3.24
        env:
          POSTGRES_USER: yapbot_test
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: yapbot_direct_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yapbot_test -d yapbot_direct_test_ci"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
        env:
          YAPBOT_TEST_DATABASE_URL: postgresql://yapbot_test:test_only@localhost:5432/yapbot_direct_test_ci
      - run: pnpm build
      - run: docker build --tag yapbot-worker:${{ github.sha }} .
