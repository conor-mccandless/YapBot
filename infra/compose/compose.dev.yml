name: yapbot-dev

services:
  postgres:
    image: postgres:18.4-alpine3.24
    environment:
      POSTGRES_DB: yapbot
      POSTGRES_PASSWORD: yapbot_dev
      POSTGRES_USER: yapbot
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yapbot -d yapbot"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  worker:
    profiles: ["worker"]
    build:
      context: ../..
      dockerfile: Dockerfile
    env_file:
      - ../../.env
    environment:
      DATABASE_URL: postgresql://yapbot:yapbot_dev@postgres:5432/yapbot
      DB_MIGRATIONS_DIR: /app/packages/db/migrations
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "-e", "process.kill(1, 0)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  postgres-data:
